<html lang="zh-CN">
<head>

<link rel="stylesheet" href="/static/hub.css?v=6">

<body>
<aside class="sidebar">

<div class="main">
<div class="wrap">
  <div class="topbar">
    <div class="title">渠道管理<small>号池 · 账号 · 模型勾选（仅本机 127.0.0.1）</small></div>
    <div class="actions">
      <span id="quotaChip" class="chip">百炼额度：未同步</span>
      <span id="hubUrlChip" class="chip" style="cursor:pointer" title="Hub 统一入口 URL（OpenAI 兼容 /v1），点击复制" onclick="copyHubUrl()">URL：…</span>
      <span id="hubKeyChip" class="chip" style="cursor:pointer" title="Hub 统一入口 key（/v1 接口鉴权用），点击复制完整 key" onclick="copyHubKey()">Hub Key：…</span>

  <div id="addPanel" class="card add-panel">
    <div class="form-row">

          <option value="bailian">阿里云百炼</option>
          <option value="openai">OpenAI 兼容（通用）</option>

    <span>号池（号池 → 账号 → 模型；勾选的模型才进入可调列表与轮询）</span>
    <button class="small" onclick="addPool()">+ 新建号池</button>
  </div>
  <div id="providers"></div>

  <div class="sec-title">百炼免费额度明细（来自 bl usage free，分钟级口径以控制台为准）</div>
  <div class="card">
    <div id="quotaSummary" class="quota-line">尚未同步。点击右上角「同步百炼额度」。</div>
    <details class="raw"><summary>查看原始返回（调试用）</summary><pre id="quotaRaw">（无）</pre></details>
  </div>
</div>
</div>
<div id="toast"></div>

<script>
let STATE = null;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CAT_ORDER = ['文本生成','多模态','音频','向量模型','重排序','图像生成','视频生成','语音合成','语音识别','其他'];

function catOf(m){
  const n = (m||'').toLowerCase();
  if(n.includes('embedding')) return '向量模型';
  if(n.includes('rerank')) return '重排序';
  if(n.includes('tts')||n.includes('cosyvoice')||n.includes('sambert')) return '语音合成';
  if(n.includes('asr')||n.includes('paraformer')||n.includes('gummy')||n.includes('filetrans')) return '语音识别';
  if(n.includes('t2v')||n.includes('i2v')||n.includes('r2v')||n.includes('video')||n.includes('happyhorse')) return '视频生成';
  if(n.includes('t2i')||n.includes('i2i')||n.includes('image')||n.includes('wanx')||n.includes('flux')) return '图像生成';
  if(n.includes('omni')||n.includes('vl')||n.includes('vision')) return '多模态';
  if(n.includes('audio')||n.includes('livetranslate')) return '音频';
  return '文本生成';
}

function toast(msg, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(()=>t.remove(), isErr ? 7000 : 3000);
}

async function api(path, method, body){
  const opt = {method: method||'GET', headers:{'Content-Type':'application/json'}};
  if(body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  if(!r.ok){
    let msg = 'HTTP ' + r.status;
    try{ const j = await r.json(); msg = j.detail || j.message || msg; }catch(e){}
    throw new Error(msg);
  }
  return await r.json();
}

function maskKey(k){
  if(!k) return '（未设置）';
  if(k.length <= 10) return k.slice(0,2) + '****';
  return k.slice(0,5) + '...' + k.slice(-4);
}

function fmtNum(n){
  if(n === null || n === undefined || n === '') return '—';
  n = Number(n);
  if(isNaN(n)) return String(n);
  if(n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + ' 万';
  return n.toLocaleString();
}

// 免费额度状态：free_ok | free_empty | free_expired | no_entry
function qState(m){
  const q = (STATE.quota && STATE.quota.entries) ? STATE.quota.entries[m] : null;
  if(!q) return 'no_entry';
  const today = (STATE.server_time||'').slice(0,10);
  if(q.expires && String(q.expires).slice(0,10) < today) return 'free_expired';
  const rem = Number(q.remaining);
  if(!isNaN(rem) && rem <= 0) return 'free_empty';
  return 'free_ok';
}

// ---- 模型勾选（号池）----
function isEnabled(p, m){ return !(p.disabled_models || []).includes(m); }
function enabledCount(p){
  const total = (p.models||[]).length;
  return total - ((p.disabled_models||[]).filter(m => (p.models||[]).includes(m)).length);
}

// ---- 反重力（Antigravity）组额度：组内模型共享 5 小时 + 每周额度 ----
function isAgProvider(p){ return p && p.type === 'openai' && (p.base_url||'').includes(':8317') && p.kind !== 'wb'; }
function isWbProvider(p){ return p && p.kind === 'wb'; }
function isCopilotProvider(p){ return p && p.type === 'openai' && (p.base_url||'').includes(':4141'); }
function agModelGroup(m){ return (m||'').toLowerCase().startsWith('gemini') ? 'gemini' : 'third'; }
function agGroupTitle(key){ return key === 'gemini' ? 'Gemini 组' : 'Claude/GPT 组'; }

function agGroupInfo(m){
  const key = agModelGroup(m);
  const aq = STATE.ag_quota || {};
  const title = agGroupTitle(key);
  const cd = (((aq.groups||{})[key])||{}).cooldown_until || '';
  if(cd && cd > (STATE.server_time||'')) return {key, title, state:'cooldown', cd, rem5:null, remw:null};
  let rem5 = null, remw = null;
  (aq.accounts||[]).forEach(a => { if(!a.ok) return; (a.groups||[]).forEach(g => {
    if(g.key !== key) return;
    (g.buckets||[]).forEach(b => {
      if(b.window === '5h') rem5 = b.remaining;
      if(b.window === 'weekly') remw = b.remaining;
    });
  });});
  if(rem5 === null && remw === null) return {key, title, state:'unknown', cd, rem5, remw};
  if((rem5 !== null && rem5 <= 0.0005) || (remw !== null && remw <= 0.0005))
    return {key, title, state:'empty', cd, rem5, remw};
  return {key, title, state:'ok', cd, rem5, remw};
}

function fmtReset(iso){
  if(!iso) return '';
  const t = new Date(iso);
  if(isNaN(t)) return '';
  const pad = n => String(n).padStart(2,'0');
  const at = pad(t.getMonth()+1)+'-'+pad(t.getDate())+' '+pad(t.getHours())+':'+pad(t.getMinutes());
  const ms = t - Date.now();
  if(ms <= 0) return at + ' 重置';
  const h = Math.floor(ms/3600000), m2 = Math.floor((ms%3600000)/60000);
  const left = h >= 24 ? (Math.floor(h/24)+' 天 '+(h%24)+' 小时') : (h+' 小时 '+m2+' 分');
  return at + ' 重置（剩 '+left+'）';
}

function quotaCell(m, isBailian, p){
  if(p && isCopilotProvider(p)){
    const cq = STATE.copilot_quota || {};
    const prem = cq.premium;
    if(!cq.synced_at || !prem) return '<span class="q-num">配额未同步</span>';
    const remain = Math.max(0, (prem.total||0) - (prem.used||0));
    return '<span class="chip '+(remain<20?'warn':'ok')+'">Premium '+remain+'/'+(prem.total||0)+'</span>' +
      ' <span class="q-num">月配额 · '+esc(cq.resets||'')+' 重置</span>';
  }
  if(p && isWbProvider(p)){
    const wq = STATE.wb_quota || {};
    const rates = wq.rates || {};
    if(!wq.synced_at || !Object.keys(rates).length) return '<span class="q-num">积分未同步</span>';
    if(m in rates){
      const rv = rates[m];
      if(rv === 'auto') return '<span class="chip">倍率浮动</span> <span class="q-num">auto 自动路由，按实际命中模型计</span>';
      const num = Number(rv);
      if(rv === 'unknown' || !isFinite(num)) return '<span class="chip">倍率未知</span> <span class="q-num">官方未标注</span>';
      return '<span class="chip '+(num===0?'ok':'')+'">倍率 x'+num+'</span>' +
        (num===0 ? ' <span class="q-num">限免中 · 不扣积分</span>'
                 : ' <span class="q-num">积分 = 用量 × '+num+'</span>');
    }
    // WB 自家模型（前缀匹配）但官方目录未收录 → 倍率未收录；海外模型才标 AG 路由
    const wbPrefixes = ['glm-5','kimi','minimax','hy3','hy4','deepseek-v4'];
    if(wbPrefixes.some(pf => m.startsWith(pf))){
      return '<span class="chip">倍率未收录</span> <span class="q-num">官方倍率目录暂无此模型</span>';
    }
    return '<span class="chip" title="该模型经反重力（AG）账号反代路由，不消耗 CodeBuddy 积分">AG 路由</span> <span class="q-num">不耗积分</span>';
  }
  if(p && isAgProvider(p)){
    const info = agGroupInfo(m);
    if(info.state === 'cooldown')
      return '<span class="chip bad">冷却中</span> <span class="q-num">'+esc(info.title)+' · 至 '+esc((info.cd||'').slice(5,16))+'</span>';
    if(info.state === 'empty')
      return '<span class="chip bad">已用尽</span> <span class="q-num">'+esc(info.title)+'（等重置）</span>';
    if(info.state === 'unknown')
      return '<span class="chip">'+esc(info.title)+'</span> <span class="q-num">额度未同步</span>';
    const worst = Math.min(info.rem5===null?1:info.rem5, info.remw===null?1:info.remw);
    const pct = Math.max(0, Math.min(100, worst*100));
    const cls = pct < 10 ? 'bad' : (pct < 30 ? 'warn' : '');
    return '<span class="chip ok">'+esc(info.title)+'</span> ' +
      '<span class="quota-bar"><i class="'+cls+'" style="width:'+pct.toFixed(1)+'%"></i></span>' +
      '<span class="q-num">组余 '+(Math.round(worst*1000)/10)+'%</span>';
  }
  const q = (STATE.quota && STATE.quota.entries) ? STATE.quota.entries[m] : null;
  if(!q) return isBailian ? '<span class="q-num" style="color:var(--bad)">无免费额度</span>' : '<span class="q-num">—</span>';
  const st = qState(m);
  let pct = null;
  if(q.total && q.remaining !== null && q.remaining !== undefined && Number(q.total) > 0){
    pct = Math.max(0, Math.min(100, Number(q.remaining)/Number(q.total)*100));
  }
  let cls = pct === null ? '' : (pct < 10 ? 'bad' : (pct < 30 ? 'warn' : ''));
  let bar = pct === null ? '' :
    '<span class="quota-bar"><i class="'+cls+'" style="width:'+pct.toFixed(1)+'%"></i></span>';
  let exp = q.expires ? ' · 到期 ' + esc(String(q.expires).slice(0,10)) : '';
  let tag = st === 'free_expired' ? '<span class="chip bad">已过期</span> ' :
            st === 'free_empty' ? '<span class="chip bad">已用尽</span> ' : '';
  return tag + bar + '<span class="q-num">剩 ' + fmtNum(q.remaining) + (q.total?' / '+fmtNum(q.total):'') + esc(exp) + '</span>';
}

function testCell(p, m){
  const tr = (p.test_results||{})[m];
  if(!tr) return '<span class="dot unknown"></span><span class="q-num">未测</span>';
  if(tr.ok) return '<span class="dot ok"></span><span class="q-num">'+tr.latency_ms+'ms</span>';
  return '<span class="dot bad"></span><span class="q-num" title="'+esc(tr.detail)+'">失败</span>';
}

function isCollapsed(pid){ return localStorage.getItem('hub_col_'+pid) === '1'; }
function setCollapsed(pid, v){ localStorage.setItem('hub_col_'+pid, v ? '1' : '0'); }
function isFreeOnly(pid){ return localStorage.getItem('hub_freeonly_'+pid) === '1'; }
function setFreeOnly(pid, v){ localStorage.setItem('hub_freeonly_'+pid, v ? '1' : '0'); }
function toggleFreeOnly(pid, on){ setFreeOnly(pid, on); render(); }

function orderedModels(p){
  const models = p.models || [];
  const order = p.model_order || [];
  const seen = new Set(); const out = [];
  for(const m of order){ if(models.includes(m) && !seen.has(m)){ seen.add(m); out.push(m); } }
  for(const m of models){ if(!seen.has(m)){ seen.add(m); out.push(m); } }
  return out;
}

// 渲染前后保持各分类 details 的展开状态
function snapshotOpenCats(){
  const open = new Set();
  document.querySelectorAll('details.cat[open]').forEach(d => open.add(d.id));
  return open;
}
let _openCats = new Set();

function renderAgQuota(p){
  const aq = STATE.ag_quota || {};
  const accounts = aq.accounts || [];
  let inner = '';
  if(!accounts.length){
    inner = '<div class="quota-line">尚未同步反重力额度（5 小时 / 每周，按组共享）。</div>';
  } else {
    accounts.forEach(a => {
      if(!a.ok){
        inner += '<div class="quota-line" style="color:var(--bad)">'+esc(a.email)+'：同步失败 '+esc(a.error||'')+'</div>';
        return;
      }
      (a.groups||[]).forEach(g => {
        const cd = (g.cooldown_until && g.cooldown_until > (STATE.server_time||'')) ? g.cooldown_until : '';
        inner += '<div class="ag-group"><div class="quota-line"><b>'+esc(g.title||g.display_name||g.key)+'</b>' +
          '<span class="q-num">组内所有模型共享</span>' +
          (cd ? '<span class="chip bad">冷却至 '+esc(cd.slice(5,16))+'</span>' : '') + '</div>';
        ['5h','weekly'].forEach(w => {
          const b = (g.buckets||[]).find(x => x.window === w);
          if(!b) return;
          const pct = (b.remaining === null || b.remaining === undefined) ? null : Math.max(0, Math.min(100, b.remaining*100));
          const cls = pct === null ? '' : (pct < 10 ? 'bad' : (pct < 30 ? 'warn' : ''));
          const bar = pct === null ? '' : '<span class="quota-bar"><i class="'+cls+'" style="width:'+pct.toFixed(1)+'%"></i></span>';
          inner += '<div class="quota-line"><span class="ag-wname">'+(w==='5h'?'5 小时额度':'每周额度')+'</span>' + bar +
            '<span class="q-num">'+(pct===null?'未知':('剩 '+(Math.round(pct*10)/10)+'%'))+' · '+esc(fmtReset(b.reset_time))+'</span></div>';
        });
        inner += '</div>';
      });
    });
  }
  const syncLine = '<div class="quota-line"><span class="q-num">'+(aq.synced_at ? '同步于 '+esc(aq.synced_at.slice(5,16)) : '')+'</span>' +
    '<button class="small" onclick="syncAgQuota()">同步反重力额度</button></div>';
  return '<div class="ag-quota"><div class="quota-line"><b>反重力额度</b>' +
    '<span class="q-num">同组模型共享 5 小时 + 每周额度；某组耗尽后轮询自动只用另一组，重置后自动恢复</span></div>' +
    inner + syncLine + '</div>';
}

function renderWbQuota(p){
  const wq = STATE.wb_quota || {};
  const accounts = wq.accounts || [];
  let inner = '';
  if(!accounts.length){
    inner = '<div class="quota-line">尚未同步 CodeBuddy 积分（多个积分包按最早到期优先扣减）。</div>';
  } else {
    accounts.forEach(a => {
      if(a.error){
        inner += '<div class="quota-line" style="color:var(--bad)">'+esc(a.nickname||a.auth_index||'账号')+'：同步失败 '+esc(a.error)+'</div>';
        return;
      }
      const c = a.credits || {};
      const pct = (c.total_size > 0) ? Math.max(0, Math.min(100, c.total_remain / c.total_size * 100)) : null;
      const cls = pct === null ? '' : (pct < 10 ? 'bad' : (pct < 30 ? 'warn' : ''));
      const bar = pct === null ? '' : '<span class="quota-bar"><i class="'+cls+'" style="width:'+pct.toFixed(1)+'%"></i></span>';
      inner += '<div class="quota-line"><b>'+esc(a.nickname||'CodeBuddy 账号')+'</b>' + bar +
        '<span class="q-num">剩 '+fmtNum(c.total_remain)+' / '+fmtNum(c.total_size)+' 积分 · 已用 '+fmtNum(c.total_used)+'</span></div>';
      (c.packages||[]).forEach(pk => {
        inner += '<div class="quota-line"><span class="ag-wname">'+esc(pk.name||'积分包')+'</span>' +
          '<span class="q-num">剩 '+fmtNum(pk.remain)+' / '+fmtNum(pk.size) +
          (pk.cycle_end ? ' · '+esc(String(pk.cycle_end).slice(5,10))+' 到期' : '') + '</span></div>';
      });
    });
  }
  const syncLine = '<div class="quota-line"><span class="q-num">'+(wq.synced_at ? '同步于 '+esc(wq.synced_at.slice(5,16)) : '')+'</span>' +
    '<button class="small" onclick="syncWbQuota()">同步积分</button></div>';
  return '<div class="ag-quota"><div class="quota-line"><b>CodeBuddy 积分</b>' +
    '<span class="q-num">按模型倍率 ×用量扣积分；多个积分包按最早到期优先扣减，海外模型经 AG 路由不耗积分</span></div>' +
    inner + syncLine + '</div>';
}

function poolSwitchSel(p){
  const pools = STATE.pools || [];
  if(pools.length <= 1) return '';
  const opts = pools.map(pl =>
    '<option value="'+esc(pl.id)+'"'+(pl.id === p.pool_id ? ' selected' : '')+'>'+esc(pl.name)+'</option>').join('');
  return '<select class="poolsel" title="移至号池" onchange="moveToPool(\''+p.id+'\', this.value)">'+opts+'</select>';
}

function renderCopilotQuota(p){
  const cq = STATE.copilot_quota || {};
  let inner = '';
  if(!cq.synced_at || !cq.login){
    inner = '<div class="quota-line">尚未同步 Copilot 配额：点「同步配额」跑一次 check-usage（只读接口，不耗 premium 配额）。</div>';
  } else {
    const prem = cq.premium || {used:0, total:0};
    const remain = Math.max(0, (prem.total||0) - (prem.used||0));
    const total = prem.total || 0;
    const pct = total ? Math.max(0, Math.min(100, remain/total*100)) : null;
    const cls = pct===null?'':(pct<10?'bad':(pct<30?'warn':''));
    const bar = pct===null?'':'<span class="quota-bar"><i class="'+cls+'" style="width:'+pct.toFixed(1)+'%"></i></span>';
    inner += '<div class="quota-line"><b>'+esc(cq.login)+'（'+esc(cq.plan||'')+'）</b>' +
      '<span class="q-num">'+esc(cq.synced_at)+' 同步</span></div>';
    inner += '<div class="quota-line"><span class="ag-wname">Premium 月配额</span>' + bar +
      '<span class="q-num">剩 '+remain+' / '+total+' · '+esc(cq.resets||'')+' 重置</span></div>';
    const chat = cq.chat, comp = cq.completions;
    if(chat && (chat.total||0) > 0)
      inner += '<div class="quota-line"><span class="ag-wname">Chat 配额</span><span class="q-num">剩 '+Math.max(0,(chat.total||0)-(chat.used||0))+' / '+chat.total+'</span></div>';
    if(comp && (comp.total||0) > 0)
      inner += '<div class="quota-line"><span class="ag-wname">Completions 配额</span><span class="q-num">剩 '+Math.max(0,(comp.total||0)-(comp.used||0))+' / '+comp.total+'</span></div>';
  }
  const hint = '<div class="quota-line"><span class="q-num">premium 模型（claude / gpt-5 / gpt-6 等）按次扣月配额；gpt-4.1 / gpt-4o 等基础模型不占配额。配额由 GitHub 官方侧核算，重置时间以官方为准。</span></div>';
  return '<div class="ag-quota"><div class="quota-line"><b>Copilot 配额</b></div>' + inner + hint + '</div>';
}

function renderProvider(p){
  const collapsed = isCollapsed(p.id);
  const isBailian = p.type === 'bailian';
  const isAg = isAgProvider(p);
  const isWb = isWbProvider(p);
  const isCopilot = isCopilotProvider(p);
  const wbst = STATE.wb_status || {};
  const activeNoFree = isBailian && p.active_model && !p.allow_paid && qState(p.active_model) !== 'free_ok';
  const activeWarn = activeNoFree ? ' <span class="chip bad">无免费额度</span>' : '';
  const paidChip = p.allow_paid ? ' <span class="chip warn">允许付费</span>' : '';
  const wbChip = isWb ? ' <span class="chip '+(wbst.logged_in?'ok':'bad')+'">'+(wbst.logged_in?'已登录':'未登录')+'</span>' : '';
  let head = '<div class="p-head"><span class="p-name">'+esc(p.name)+'</span>' +
    '<span class="chip">'+(isWb?'腾讯 CodeBuddy 反代':(isCopilot?'GitHub Copilot 反代':(isBailian?'阿里云百炼':'OpenAI 兼容')))+'</span>' + wbChip + paidChip +
    '<span class="chip blue">已勾选 '+enabledCount(p)+' / '+(p.models||[]).length+'</span>' +
    '<span class="p-active">当前模型：<b>'+esc(p.active_model||'未选择')+'</b>'+activeWarn+'</span>' +
    '<span class="grow"></span>' + poolSwitchSel(p) +
    '<button class="small" onclick="toggleCollapse(\''+p.id+'\')">'+(collapsed?'展开':'收起')+'</button></div>';
  if(collapsed) return '<div class="card collapsed">'+head+'</div>';

  const models = orderedModels(p);
  const nFree = isBailian ? models.filter(m => qState(m)==='free_ok').length : 0;

  // 本卡片独立过滤：只看有免费额度
  const freeOnly = isBailian && isFreeOnly(p.id);
  const viewModels = freeOnly ? models.filter(m => qState(m)==='free_ok') : models;
  const hiddenCnt = models.length - viewModels.length;

  // 分类分组
  const groups = {};
  for(const m of viewModels){ const c = catOf(m); (groups[c] = groups[c] || []).push(m); }
  const cats = Object.keys(groups).sort((a,b)=>{
    let ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    if(ia<0) ia = CAT_ORDER.length-1; if(ib<0) ib = CAT_ORDER.length-1;
    return ia - ib;
  });
  const catHtml = cats.map(c => {
    const catId = 'cat-' + p.id + '-' + c;
    const rows = groups[c].map(m => {
      const cur = p.active_model === m;
      const en = isEnabled(p, m);
      const st = isBailian ? qState(m) : 'free_ok';
      const noFree = isBailian && st !== 'free_ok';
      const testBtn = (noFree && !p.allow_paid)
        ? '<button class="small" disabled title="无免费额度，未勾选允许付费，不会发起调用">测试</button> '
        : '<button class="small" onclick="testModel(\''+p.id+'\',\''+esc(m)+'\')">测试</button> ';
      return '<tr class="'+(cur?'current':'')+(en?'':' mdis')+'">' +
        '<td style="width:3%"><input type="checkbox" class="mchk" title="勾选 = 进入可调列表（轮询与 Harness 单选）" '+(en?'checked ':'')+'onchange="toggleModel(\''+p.id+'\',\''+esc(m)+'\', this.checked)"></td>' +
        '<td class="model-id">'+esc(m)+(cur?' <span class="chip blue">当前</span>':'')+(en?'':' <span class="chip">未勾选</span>')+'</td>' +
        '<td>'+quotaCell(m, isBailian, p)+'</td>' +
        '<td>'+testCell(p, m)+'</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="tiny" title="上移（轮询顺序）" onclick="moveModel(\''+p.id+'\',\''+esc(m)+'\',-1)">↑</button>' +
          '<button class="tiny" title="下移（轮询顺序）" onclick="moveModel(\''+p.id+'\',\''+esc(m)+'\',1)">↓</button>' +
        '</td>' +
        '<td style="white-space:nowrap">' +
          (cur ? '' : '<button class="small" onclick="setActive(\''+p.id+'\',\''+esc(m)+'\')">设为当前</button> ') +
          testBtn +
          '<button class="small" onclick="copyJoin(\''+p.id+'\',\''+esc(m)+'\')">复制接入</button> ' +
          '<button class="small danger" onclick="delModel(\''+p.id+'\',\''+esc(m)+'\')">删除</button>' +
        '</td></tr>';
    }).join('');
    const openByDefault = _openCats.size ? _openCats.has(catId) : (c === '文本生成' || groups[c].includes(p.active_model));
    const enCnt = groups[c].filter(m => isEnabled(p, m)).length;
    return '<details class="cat" id="'+catId+'"'+(openByDefault?' open':'')+'><summary>'+esc(c)+'<span class="cnt">'+groups[c].length+' 个模型 · 已勾选 '+enCnt+'</span></summary>' +
      '<table><thead><tr><th style="width:3%"></th><th style="width:29%">模型</th><th style="width:28%">免费额度</th><th style="width:10%">连通性</th><th style="width:6%">排序</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
  }).join('');

  const fetchErr = p.fetch_error ? '<div class="quota-line" style="color:var(--bad)">'+esc(p.fetch_error)+'</div>' : '';
  const wbHint = isWb ? '<div class="quota-line">' + (wbst.logged_in
    ? '已通过 CodeBuddy 账号登录反代；「刷新模型列表」拉取模型，「同步积分」更新积分余额与每模型使用倍率。'
    : '尚未登录：点右上角「登录 WorkBuddy」，在打开的腾讯 CodeBuddy 页面完成授权（微信扫码 / 手机号 / 邮箱），成功后自动拉取 glm-5.2 / kimi-k2.7 / deepseek-v4 等模型。') + '</div>' : '';
  const paidBox = isBailian ?
    '<label class="paid-box'+(p.allow_paid?' on':'')+'" title="勾选后：测试与轮询可使用无免费额度的模型（会计费）。默认不勾选＝只用免费额度。">' +
    '<input type="checkbox" '+(p.allow_paid?'checked ':'')+'onchange="togglePaid(\''+p.id+'\', this.checked)">允许付费调用</label>' : '';
  const freeOnlyBox = isBailian ?
    '<label class="paid-box'+(freeOnly?' on':'')+'" title="只显示有免费额度的模型（仅影响本卡片显示，每个渠道各自独立设置）">' +
    '<input type="checkbox" '+(freeOnly?'checked ':'')+'onchange="toggleFreeOnly(\''+p.id+'\', this.checked)">只看有免费额度</label>' : '';
  const hiddenHint = (freeOnly && hiddenCnt > 0) ?
    '<span class="q-num">已隐藏无免费额度 '+hiddenCnt+' 个</span>' : '';
  const quotaNote = isBailian ? '<span class="chip '+(nFree?'ok':'bad')+'">有免费额度 '+nFree+' / '+models.length+'</span>' : '';

  return '<div class="card">' + head + wbHint +
    '<div class="p-meta">' +
      '<span>URL <code>'+esc(p.base_url)+'</code> <button class="small" onclick="cp(\''+esc(p.base_url)+'\')">复制</button></span>' +
      '<span>Key <code id="key-'+p.id+'">'+esc(maskKey(p.api_key))+'</code> ' +
        '<button class="small" onclick="cp(\''+esc(p.api_key)+'\')">复制</button>' +
        '<button class="maskbtn" onclick="toggleKey(\''+p.id+'\')">显/隐</button></span>' +
      (p.last_refresh ? '<span>模型于 '+esc(p.last_refresh)+' 刷新</span>' : '') + quotaNote +
    '</div>' +
    '<div class="p-ops">' +
      '<button class="small" onclick="refreshModels(\''+p.id+'\')">刷新模型列表</button>' +
      (isAg ? '<button class="small" title="同步反重力 5 小时 / 每周额度（不消耗对话额度）" onclick="syncAgQuota()">同步额度</button>' : '') +
      (isWb ? '<button class="small" title="同步 CodeBuddy 积分与每模型使用倍率（不消耗积分）" onclick="syncWbQuota()">同步积分</button>' : '') +
      (isCopilot ? '<button class="small" title="同步 Copilot premium 月配额（只读 check-usage，不耗配额）" onclick="syncCopilotQuota()">同步配额</button>' : '') +
      '<button class="small" title="勾选本渠道全部模型（进入可调列表）" onclick="bulkEnable(\''+p.id+'\', true)">全选模型</button>' +
      '<button class="small" title="取消勾选本渠道全部模型（退出可调列表与轮询）" onclick="bulkEnable(\''+p.id+'\', false)">全不选</button>' +
      '<button class="small" onclick="testModel(\''+p.id+'\',\''+esc(p.active_model||'')+'\')">测试当前模型</button>' +
      '<button class="small" onclick="copyJoin(\''+p.id+'\',\''+esc(p.active_model||'')+'\')">复制当前三件套</button>' +
      '<button class="small" title="BASE_URL=http://127.0.0.1:8787/v1，MODEL=auto，由 Hub 按排序自动轮询免费额度模型" onclick="copyHub(\''+p.id+'\')">复制轮询三件套</button>' +
      '<button class="small danger" title="删除：免费额度已过期/已用尽 + 测试失败的模型" onclick="cleanup(\''+p.id+'\')">清理失效模型</button>' +
      '<button class="small danger" onclick="delProvider(\''+p.id+'\',\''+esc(p.name)+'\')">删除渠道</button>' +
      paidBox + freeOnlyBox + hiddenHint +
    '</div>' +
    (isAg ? renderAgQuota(p) : (isWb ? renderWbQuota(p) : (isCopilot ? renderCopilotQuota(p) : ''))) +
    (viewModels.length ? '<div class="order-hint">勾选 = 模型进入可调列表（auto 轮询与 Harness 单选都只用已勾选模型）；轮询按下列顺序进行（↑↓ 调整）。</div>' : '') +
    fetchErr +
    (viewModels.length ? catHtml :
      (freeOnly ? '<div class="empty">当前过滤下没有模型（已勾选「只看有免费额度」）</div>'
                : '<div class="empty">暂无模型，点「刷新模型列表」拉取</div>')) +
  '</div>';
}

function renderPool(pl){
  const ps = STATE.providers || [];
  const provs = (pl.providers || []).map(pid => ps.find(x => x.id === pid)).filter(Boolean);
  const multi = (STATE.pools || []).length > 1;
  const head = '<div class="pool-head"><span class="pool-name">'+esc(pl.name)+'</span>' +
    '<span class="chip">'+provs.length+' 个账号</span>' +
    '<span class="grow"></span>' +
    '<button class="small" onclick="renamePool(\''+esc(pl.id)+'\',\''+esc(pl.name)+'\')">重命名</button>' +
    (multi ? '<button class="small danger" onclick="delPool(\''+esc(pl.id)+'\',\''+esc(pl.name)+'\')">删除号池</button>' : '') +
    '</div>';
  const body = provs.length ? provs.map(renderProvider).join('')
    : '<div class="card empty">本号池还没有账号，点右上角「+ 添加渠道」。</div>';

function render(){
  const box = $('#providers');
  const ps = STATE.providers || [];
  const pools = STATE.pools || [];
  if(!ps.length){
    box.innerHTML = '<div class="card empty">还没有渠道。点右上角「+ 添加渠道」，填入 Base URL 和 Key 即可自动拉取模型列表。</div>';
  } else if(pools.length){
    box.innerHTML = pools.map(renderPool).join('');
  } else {
    box.innerHTML = ps.map(renderProvider).join('');
  }
  // Hub 统一 key
  const hk = STATE.hub_key || '';
  $('#hubKeyChip').textContent = 'Hub Key：' + (hk ? hk.slice(0,9) + '…' + hk.slice(-3) : '未生成');
  $('#hubUrlChip').textContent = 'URL：' + (STATE.hub_base || '127.0.0.1:8787/v1');
  // 额度区
  const q = STATE.quota || {};
  const entries = q.entries || {};
  const keys = Object.keys(entries);
  if(q.synced_at){
    $('#quotaChip').className = 'chip ok';
    $('#quotaChip').textContent = '百炼额度：' + q.synced_at.slice(5,16) + ' 已同步';
    let lines = keys.map(k => {
      const e = entries[k];
      return esc(k) + '：剩 ' + fmtNum(e.remaining) + (e.total ? ' / ' + fmtNum(e.total) : '') + (e.expires ? ' · 到期 ' + esc(String(e.expires).slice(0,10)) : '');
    });
    $('#quotaSummary').innerHTML = lines.length ? lines.join('<br>') : '已同步，但未解析到条目（见下方原始返回）。';
  } else {
    let msg = '尚未同步。点击右上角「同步百炼额度」。';
    let cls = 'chip';
    if(q.last_error === 'console_login_required'){
      msg = '需要一次性控制台授权：点右上角「授权百炼控制台」，浏览器会打开阿里云登录页，登录完成后额度会自动同步，以后不用再授权。';
      cls = 'chip warn';
    } else if(q.last_error === 'bl_missing'){
      msg = '未检测到百炼 CLI（bl），请先安装：npm install -g bailian-cli';
      cls = 'chip bad';
    }
    $('#quotaChip').className = cls;
    $('#quotaChip').textContent = '百炼额度：' + (q.last_error ? '待处理' : '未同步');
    $('#quotaSummary').textContent = msg;
  }
  $('#quotaRaw').textContent = q.raw ? JSON.stringify(q.raw, null, 2) : '（无）';
}

function toggleKey(pid){

function cp(text){
  navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>{
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制');
  });
}

function copyJoin(pid, model){
  const p = STATE.providers.find(x=>x.id===pid);
  if(!p) return;
  const m = model || p.active_model || '';
  const text = 'BASE_URL=' + p.base_url + '\nAPI_KEY=' + p.api_key + '\nMODEL=' + m;
  cp(text);
}

  await api('/api/providers/'+pid, 'DELETE');
  toast('已删除');
  await load();
}

let _authPoll = null;
async function startBlAuth(){
  const btn = $('#authBtn');
  btn.disabled = true;
  try{
    const r = await api('/api/bl/login', 'POST', {});
    toast(r.message || '授权流程已启动，请在浏览器完成登录');
    btn.textContent = '等待浏览器登录…';
    if(_authPoll) clearInterval(_authPoll);
    _authPoll = setInterval(pollBlAuth, 3000);
  }catch(e){
    toast('启动授权失败：' + e.message, true);
    btn.disabled = false;
  }
}

async function pollBlAuth(){
  try{
    const s = await api('/api/bl/login/status');
    if(s.running) return;
    clearInterval(_authPoll); _authPoll = null;
    const btn = $('#authBtn');
    btn.disabled = false;
    btn.textContent = '授权百炼控制台';
    const qs = s.quota_sync;
    if(qs && qs.ok){
      toast('授权成功，额度已自动同步（' + qs.count + ' 个条目）');
    }else if(qs && qs.state === 'console_login_required'){
      toast('授权未完成或已取消，可重新点击「授权百炼控制台」', true);
    }else{
      toast('授权流程已结束：' + ((qs && qs.message) || '请再点同步额度确认'), qs && !qs.ok);
    }
    await load();
  }catch(e){ /* 轮询失败忽略，下轮再试 */ }
}

async function load(){
  _openCats = snapshotOpenCats();
  STATE = await api('/api/state');
  render();
  // 反重力额度超过 10 分钟未同步 → 后台同步一次再重渲染（不消耗对话额度）
  try{
    const hasAg = (STATE.providers||[]).some(isAgProvider);
    if(hasAg && !window._agSyncing){
      const st = (STATE.ag_quota||{}).synced_at || '';
      const tSrv = Date.parse((STATE.server_time||'').replace(' ','T'));
      const tSyn = st ? Date.parse(st.replace(' ','T')) : 0;
      if(!st || (tSrv - tSyn) > 600000){
        window._agSyncing = true;
        api('/api/ag/quota/refresh', 'POST', {})
          .then(()=>{ window._agSyncing = false; load(); })
          .catch(()=>{ window._agSyncing = false; });
      }
    }
  }catch(e){}
  // CodeBuddy 积分超过 10 分钟未同步 → 后台同步一次再重渲染（只查计量接口，不消耗积分）
  try{
    const hasWb = (STATE.providers||[]).some(isWbProvider);
    if(hasWb && (STATE.wb_status||{}).logged_in && !window._wbSyncing){
      const st2 = (STATE.wb_quota||{}).synced_at || '';
      const tSrv2 = Date.parse((STATE.server_time||'').replace(' ','T'));
      const tSyn2 = st2 ? Date.parse(st2.replace(' ','T')) : 0;
      if(!st2 || (tSrv2 - tSyn2) > 600000){
        window._wbSyncing = true;
        api('/api/wb/quota/refresh', 'POST', {})
          .then(()=>{ window._wbSyncing = false; load(); })
          .catch(()=>{ window._wbSyncing = false; });
      }
    }
  }catch(e){}
  // Copilot 配额超过 10 分钟未同步 → 后台同步一次再重渲染（只读 check-usage，不耗配额）
  try{
    const hasCp = (STATE.providers||[]).some(isCopilotProvider);
    if(hasCp && !window._cpSyncing){
      const st3 = (STATE.copilot_quota||{}).synced_at || '';
      const tSrv3 = Date.parse((STATE.server_time||'').replace(' ','T'));
      const tSyn3 = st3 ? Date.parse(st3.replace(' ','T')) : 0;
      if(!st3 || (tSrv3 - tSyn3) > 600000){
        window._cpSyncing = true;
        api('/api/copilot/quota/refresh', 'POST', {})
          .then(()=>{ window._cpSyncing = false; load(); })
          .catch(()=>{ window._cpSyncing = false; });
      }
    }
  }catch(e){}
}
