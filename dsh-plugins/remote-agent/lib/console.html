<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>远程控制台 · dsh</title>
<style>
  :root{
    --bg:#F4F6FB; --card:#FFFFFF; --line:#E5E9F2; --txt:#121722; --sub:#6D778C;
    --pri:#2F5DDF; --pri-soft:#EAF0FF; --ok:#22A06B; --bad:#D64545; --warn:#D98E04;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  .wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;height:100%;background:var(--bg)}
  @media(min-width:700px){.wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

  /* header */
  .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
  .hd h1{font-size:16px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:11px;color:var(--pri);background:var(--pri-soft);border-radius:99px;padding:3px 9px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:32px;font-size:15px;color:var(--sub);cursor:pointer;flex:none}
  .iconbtn:active{background:var(--bg)}

  /* main */
  .main{flex:1;overflow-y:auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .muted{color:var(--sub);font-size:12px}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:13px}

  /* buttons */
  .btn{border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:13px;padding:8px 14px;cursor:pointer;font-family:inherit}
  .btn:active{opacity:.85}
  .btn[disabled]{opacity:.45;cursor:default}
  .btn.ghost{background:var(--pri-soft);color:var(--pri)}
  .btn.danger{background:#FBEAEA;color:var(--bad)}
  .btn.sm{padding:5px 10px;font-size:12px}

  /* gate */
  .gate{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;gap:12px}
  .gate .card{width:100%;max-width:340px;text-align:center}
  .gate input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0;font-family:inherit}
  .gate h2{font-size:16px;margin:4px 0}

  /* session list */
  .sess{display:flex;align-items:center;gap:10px;cursor:pointer}
  .sess .tt{flex:1;min-width:0}
  .sess .tt .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess .tt .s{font-size:11px;color:var(--sub);margin-top:2px}
  .badge{font-size:10px;border-radius:99px;padding:2px 7px;flex:none}
  .badge.live{background:#E7F6EE;color:var(--ok)}
  .badge.busy{background:#FDF3E2;color:var(--warn)}
  .badge.phone{background:var(--pri-soft);color:var(--pri)}
  .badge.err{background:#FBEAEA;color:var(--bad)}
  .chev{color:var(--sub);flex:none}

  /* composer */
  .composer textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;min-height:76px;resize:vertical;font-family:inherit}
  .composer input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:8px;font-family:inherit}
  .composer .row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

  /* chat */
  .msg{max-width:86%;padding:9px 12px;border-radius:12px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word;font-size:14px}
  .msg.user{margin-left:auto;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant{margin-right:auto;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.tool{margin:0 auto 8px;background:transparent;border:1px dashed var(--line);color:var(--sub);font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;padding:4px 10px;border-radius:8px;max-width:96%}
  .chatin{flex:none;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
  .chatin textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;min-height:40px;max-height:120px;resize:none;font-family:inherit}
  .errbar{background:#FBEAEA;color:var(--bad);font-size:12px;border-radius:8px;padding:8px 12px;margin-bottom:8px}
  .busybar{display:flex;align-items:center;gap:8px;color:var(--warn);font-size:12px;margin-bottom:8px}
  .spin{width:12px;height:12px;border:2px solid var(--warn);border-top-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* services */
  .svc{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.on{background:var(--ok)}
  .dot.off{background:#C4CBD8}
  .svc .nm{flex:1;min-width:0}
  .svc .nm .n{font-size:14px;font-weight:500}
  .svc .nm .d{font-size:11px;color:var(--sub);margin-top:1px}

  /* reports */
  .rep pre{margin:6px 0 0;font-size:11px;color:var(--sub);white-space:pre-wrap;word-break:break-all;max-height:180px;overflow:auto;background:var(--bg);border-radius:6px;padding:8px}

  /* tabbar */
  .tabbar{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tab .ic{font-size:17px;line-height:1}
  .tab.on{color:var(--pri);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app" style="visibility:hidden">

  <div class="hd">
    <button class="iconbtn" id="backBtn" style="display:none">&#8592;</button>
    <h1 id="hdTitle">远程控制台</h1>
    <span class="chip" id="modelChip" title="当前模型">…</span>
    <button class="iconbtn" id="refreshBtn" title="刷新">&#8635;</button>
  </div>

  <div class="main" id="main"></div>

  <div class="chatin" id="chatIn" style="display:none">
    <textarea id="chatBox" placeholder="追问这个会话…" rows="1"></textarea>
    <button class="btn" id="chatSend">发送</button>
  </div>

  <div class="tabbar" id="tabbar">
    <button class="tab on" data-tab="chat"><span class="ic">&#128172;</span>会话</button>
    <button class="tab" data-tab="svc"><span class="ic">&#9881;</span>服务</button>
    <button class="tab" data-tab="rep"><span class="ic">&#128196;</span>报告</button>
  </div>
</div>

<div class="gate" id="gate" style="display:none">
  <div class="card">
    <h2>需要访问令牌</h2>
    <div class="muted">首次使用请输入控制台令牌（在电脑的<br>F:\llm_hub\remote_console_url.txt 里）</div>
    <input id="gateInput" type="password" placeholder="rct-…" autocomplete="off">
    <button class="btn" id="gateBtn" style="width:100%">保存并进入</button>
    <div class="muted" id="gateErr" style="color:var(--bad);margin-top:8px"></div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var main = $('main'), hdTitle = $('hdTitle'), backBtn = $('backBtn'),
      chatIn = $('chatIn'), chatBox = $('chatBox'), chatSend = $('chatSend'),
      modelChip = $('modelChip');

  var S = {
    token: '',
    tab: 'chat',          // chat | svc | rep
    view: 'list',         // list | detail（仅 chat tab）
    sessions: [], active: [], model: null,
    services: [], reports: [],
    current: null,        // 当前打开的会话 {id,title,phoneCreated}
    busy: false, chatErr: '',
    poll: null, svcTimer: null,
    showComposer: false,
  };

  /* ---------- token ---------- */
  function initToken(){
    try{
      var u = new URL(location.href);
      var t = u.searchParams.get('token');
      if (t){
        localStorage.setItem('ra_token', t);
        u.searchParams.delete('token');
        history.replaceState(null, '', u.pathname + u.search);
      }
    }catch(_){}
    S.token = localStorage.getItem('ra_token') || '';
  }

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + S.token });
    if (opts.body){ opts.headers['Content-Type'] = 'application/json'; }
    return fetch(path, opts).then(function(r){
      if (r.status === 401){ var e = new Error('unauthorized'); e.auth = true; throw e; }
      return r.json().then(function(j){
        if (!j.ok){ throw new Error(j.error || ('HTTP ' + r.status)); }
        return j.data;
      });
    });
  }

  function showGate(msg){
    $('app').style.visibility = 'hidden';
    $('gate').style.display = 'flex';
    $('gateErr').textContent = msg || '';
  }
  function hideGate(){
    $('gate').style.display = 'none';
    $('app').style.visibility = 'visible';
  }
  function authFail(){ showGate('令牌无效或已更换，请重新输入'); }

  $('gateBtn').addEventListener('click', function(){
    var v = $('gateInput').value.trim();
    if (!v){ return; }
    S.token = v;
    localStorage.setItem('ra_token', v);
    api('/remote-agent/api/dsh/model').then(function(m){
      S.model = m; hideGate(); render(); loadTab();
    }).catch(function(e){
      if (e.auth){ authFail(); } else { $('gateErr').textContent = '连接失败：' + e.message; }
    });
  });

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function fmtTime(iso){
    if (!iso){ return ''; }
    var d = new Date(iso);
    if (isNaN(d)){ return ''; }
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function stopPoll(){ if (S.poll){ clearInterval(S.poll); S.poll = null; } }
  function stopSvcTimer(){ if (S.svcTimer){ clearInterval(S.svcTimer); S.svcTimer = null; } }

  /* ---------- data ---------- */
  function loadModel(){
    return api('/remote-agent/api/dsh/model').then(function(m){
      S.model = m;
      modelChip.textContent = (m.provider ? m.provider + ' / ' : '') + (m.model || '?');
      modelChip.title = '当前模型：' + modelChip.textContent;
    }).catch(function(e){ if (e.auth){ authFail(); } });
  }
  function loadSessions(){
    return Promise.all([
      api('/remote-agent/api/dsh/sessions?limit=60'),
      api('/remote-agent/api/dsh/active')
    ]).then(function(rs){
      S.sessions = rs[0] || [];
      S.active = rs[1] || [];
      if (S.view === 'list'){ render(); }
    }).catch(function(e){ if (e.auth){ authFail(); } });
  }
  function loadServices(){
    return api('/remote-agent/api/services').then(function(d){
      S.services = d || [];
      if (S.tab === 'svc'){ render(); }
    }).catch(function(e){ if (e.auth){ authFail(); } });
  }
  function loadReports(){
    return api('/remote-agent/api/reports').then(function(d){
      S.reports = d || [];
      if (S.tab === 'rep'){ render(); }
    }).catch(function(e){ if (e.auth){ authFail(); } });
  }
  function loadChat(silent){
    if (!S.current){ return Promise.resolve(); }
    return api('/remote-agent/api/dsh/session-events?id=' + encodeURIComponent(S.current.id) + '&limit=300')
      .then(function(d){
        S.chat = d.chat || [];
        S.busy = !!d.busy;
        S.chatErr = d.error || '';
        render();
        if (!silent){ scrollBottom(); }
      }).catch(function(e){ if (e.auth){ authFail(); stopPoll(); } });
  }
  function scrollBottom(){
    requestAnimationFrame(function(){ main.scrollTop = main.scrollHeight; });
  }

  function loadTab(){
    stopPoll(); stopSvcTimer();
    if (S.tab === 'chat'){
      if (S.view === 'detail'){ startChatPoll(); }
      else { loadSessions(); }
    }
    else if (S.tab === 'svc'){
      loadServices();
      S.svcTimer = setInterval(loadServices, 15000);
    }
    else if (S.tab === 'rep'){ loadReports(); }
  }
  function startChatPoll(){
    stopPoll();
    loadChat(true);
    S.poll = setInterval(function(){ loadChat(true); }, 2500);
  }

  /* ---------- actions ---------- */
  function createSession(){
    var prompt = $('newPrompt').value.trim();
    if (!prompt){ return; }
    var title = $('newTitle').value.trim();
    var btn = $('newSend');
    btn.disabled = true; btn.textContent = '创建中…';
    api('/remote-agent/api/dsh/session-create', {
      method: 'POST',
      body: JSON.stringify({ prompt: prompt, title: title || undefined })
    }).then(function(d){
      S.showComposer = false;
      openSession({ id: d.sessionId, title: title || prompt.slice(0, 24), phoneCreated: true });
    }).catch(function(e){
      btn.disabled = false; btn.textContent = '创建并发送';
      if (e.auth){ authFail(); } else { alert('创建失败：' + e.message); }
    });
  }
  function openSession(s){
    S.current = s; S.view = 'detail'; S.chat = []; S.busy = false; S.chatErr = '';
    render(); startChatPoll();
  }
  function sendFollowup(){
    var text = chatBox.value.trim();
    if (!text || !S.current || S.busy){ return; }
    chatSend.disabled = true;
    api('/remote-agent/api/dsh/session-prompt', {
      method: 'POST',
      body: JSON.stringify({ sessionId: S.current.id, prompt: text })
    }).then(function(){
      chatBox.value = '';
      S.chat.push({ role: 'user', text: text });
      S.busy = true;
      render(); scrollBottom();
      setTimeout(function(){ loadChat(true); }, 600);
    }).catch(function(e){
      if (e.auth){ authFail(); } else { alert('发送失败：' + e.message); }
    }).then(function(){ chatSend.disabled = false; });
  }
  function cancelSession(){
    if (!S.current){ return; }
    if (!confirm('打断这个会话正在生成的内容？')){ return; }
    api('/remote-agent/api/dsh/session-cancel', {
      method: 'POST',
      body: JSON.stringify({ sessionId: S.current.id })
    }).then(function(){ setTimeout(function(){ loadChat(true); }, 500); })
      .catch(function(e){ if (e.auth){ authFail(); } else { alert(e.message); } });
  }
  function svcAction(s, action){
    if (action === 'stop' && !confirm('确认停止「' + s.name + '」？')){ return; }
    api('/remote-agent/api/services/' + s.id + '/' + action, { method: 'POST' })
      .then(function(){ setTimeout(loadServices, 1500); })
      .catch(function(e){ if (e.auth){ authFail(); } else { alert(e.message); } });
  }

  /* ---------- render ---------- */
  function render(){
    var html = '';
    backBtn.style.display = (S.tab === 'chat' && S.view === 'detail') ? '' : 'none';
    chatIn.style.display = (S.tab === 'chat' && S.view === 'detail' && S.current && S.current.phoneCreated) ? '' : 'none';

    if (S.tab === 'chat' && S.view === 'detail'){
      hdTitle.textContent = S.current ? (S.current.title || S.current.id.slice(0, 18)) : '会话';
      if (S.chatErr){ html += '<div class="errbar">' + esc(S.chatErr) + '</div>'; }
      if (S.busy){
        html += '<div class="busybar"><span class="spin"></span>正在生成…' +
                '<button class="btn danger sm" id="cancelBtn">打断</button></div>';
      }
      var chat = S.chat || [];
      if (!chat.length){
        html += '<div class="empty">还没有消息</div>';
      }
      for (var i = 0; i < chat.length; i++){
        var m = chat[i];
        if (m.role === 'tool'){
          html += '<div class="msg tool">' + esc(m.text) + '</div>';
        } else {
          html += '<div class="msg ' + (m.role === 'user' ? 'user' : 'assistant') + '">' + esc(m.text) + '</div>';
        }
      }
      if (S.current && !S.current.phoneCreated){
        html += '<div class="empty" style="padding:12px 0">该会话不是手机入口创建的，仅可查看</div>';
      }
    }
    else if (S.tab === 'chat'){
      hdTitle.textContent = '远程控制台';
      if (S.showComposer){
        html += '<div class="card composer">' +
          '<textarea id="newPrompt" placeholder="给 dsh 派个活，比如：把 hub 面板的服务状态整理一下"></textarea>' +
          '<input id="newTitle" placeholder="会话标题（可选）">' +
          '<div class="row"><button class="btn ghost sm" id="composerCancel">取消</button>' +
          '<button class="btn sm" id="newSend">创建并发送</button></div></div>';
      } else {
        html += '<div class="card sess" id="composerOpen">' +
          '<span style="font-size:18px;color:var(--pri)">&#65291;</span>' +
          '<div class="tt"><div class="t" style="color:var(--pri)">新建会话</div>' +
          '<div class="s">手机端直接派任务给 dsh</div></div></div>';
      }
      var ss = S.sessions || [];
      if (!ss.length){ html += '<div class="empty">暂无会话</div>'; }
      for (var j = 0; j < ss.length; j++){
        var s = ss[j];
        var badges = '';
        if (s.phoneCreated){ badges += '<span class="badge phone">手机</span>'; }
        if (s.live){ badges += '<span class="badge live">活跃</span>'; }
        html += '<div class="card sess" data-sid="' + esc(s.id) + '">' +
          '<div class="tt"><div class="t">' + esc(s.title || s.id.slice(0, 20)) + '</div>' +
          '<div class="s">' + esc(fmtTime(s.updatedAt || s.createdAt)) + '</div></div>' +
          badges + '<span class="chev">&#8250;</span></div>';
      }
    }
    else if (S.tab === 'svc'){
      hdTitle.textContent = '服务';
      var sv = S.services || [];
      if (!sv.length){ html += '<div class="empty">加载中…</div>'; }
      for (var k = 0; k < sv.length; k++){
        var v = sv[k];
        html += '<div class="card svc">' +
          '<span class="dot ' + (v.running ? 'on' : 'off') + '"></span>' +
          '<div class="nm"><div class="n">' + esc(v.name) + '</div>' +
          '<div class="d">' + (v.running ? '运行中' : '已停止') + (v.note ? ' · ' + esc(v.note) : '') + '</div></div>' +
          (v.running
            ? (v.stoppable ? '<button class="btn danger sm" data-svc="' + esc(v.id) + '" data-act="stop">停止</button>' : '')
            : '<button class="btn ghost sm" data-svc="' + esc(v.id) + '" data-act="start">启动</button>') +
          '</div>';
      }
      html += '<div class="muted" style="text-align:center;margin-top:6px">每 15 秒自动刷新</div>';
    }
    else {
      hdTitle.textContent = '任务报告';
      var rp = S.reports || [];
      if (!rp.length){ html += '<div class="empty">暂无报告</div>'; }
      for (var r = 0; r < rp.length; r++){
        var item = rp[r];
        var label = item.ts || item.time || item.createdAt || item.date || ('#' + (r + 1));
        html += '<div class="card rep"><div class="muted">' + esc(String(label)) + '</div>' +
          '<pre>' + esc(JSON.stringify(item, null, 2)) + '</pre></div>';
      }
    }

    main.innerHTML = html;
    bind();
  }

  function bind(){
    var q = function(sel){ return main.querySelector(sel); };
    var qa = function(sel){ return main.querySelectorAll(sel); };

    var co = q('#composerOpen');
    if (co){ co.addEventListener('click', function(){ S.showComposer = true; render(); }); }
    var cc = q('#composerCancel');
    if (cc){ cc.addEventListener('click', function(){ S.showComposer = false; render(); }); }
    var ns = q('#newSend');
    if (ns){ ns.addEventListener('click', createSession); }

    var cards = qa('.card.sess[data-sid]');
    for (var i = 0; i < cards.length; i++){
      (function(node){
        node.addEventListener('click', function(){
          var sid = node.getAttribute('data-sid');
          var s = null;
          for (var j = 0; j < S.sessions.length; j++){
            if (S.sessions[j].id === sid){ s = S.sessions[j]; break; }
          }
          if (s){ openSession(s); }
        });
      })(cards[i]);
    }

    var cbtn = q('#cancelBtn');
    if (cbtn){ cbtn.addEventListener('click', cancelSession); }

    var sbtns = qa('button[data-svc]');
    for (var k = 0; k < sbtns.length; k++){
      (function(node){
        node.addEventListener('click', function(){
          var id = node.getAttribute('data-svc'), act = node.getAttribute('data-act');
          var svc = null;
          for (var j = 0; j < S.services.length; j++){
            if (S.services[j].id === id){ svc = S.services[j]; break; }
          }
          if (svc){ svcAction(svc, act); }
        });
      })(sbtns[k]);
    }
  }

  /* ---------- chrome events ---------- */
  backBtn.addEventListener('click', function(){
    S.view = 'list'; S.current = null; stopPoll();
    render(); loadSessions();
  });
  $('refreshBtn').addEventListener('click', function(){
    loadModel();
    if (S.tab === 'chat'){ S.view === 'detail' ? loadChat() : loadSessions(); }
    else if (S.tab === 'svc'){ loadServices(); }
    else { loadReports(); }
  });
  chatSend.addEventListener('click', sendFollowup);
  chatBox.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendFollowup(); }
  });

  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++){
    (function(node){
      node.addEventListener('click', function(){
        if (node.classList.contains('on')){ return; }
        for (var j = 0; j < tabs.length; j++){ tabs[j].classList.remove('on'); }
        node.classList.add('on');
        S.tab = node.getAttribute('data-tab');
        S.view = 'list'; S.current = null;
        render(); loadTab();
      });
    })(tabs[i]);
  }

  /* ---------- boot ---------- */
  initToken();
  if (!S.token){ showGate(''); }
  else {
    api('/remote-agent/api/dsh/model').then(function(m){
      S.model = m;
      modelChip.textContent = (m.provider ? m.provider + ' / ' : '') + (m.model || '?');
      hideGate(); render(); loadTab();
    }).catch(function(e){
      if (e.auth){ authFail(); } else { showGate('连接失败：' + e.message); }
    });
  }
  render();
})();
</script>
</body>
</html>
